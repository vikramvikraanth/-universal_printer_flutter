name: Tag on version change

# When universal_printer_flutter/pubspec.yaml changes on main and its `version:` has no matching
# vX.Y.Z tag yet, create + push that tag. The tag then triggers publish.yml (which publishes to
# pub.dev via OIDC). Net effect: commit a version bump to main -> auto-tag -> auto-publish.
#
# IMPORTANT: a tag pushed by the default GITHUB_TOKEN does NOT trigger other workflows (GitHub
# anti-recursion), so a plain tag push can't start publish.yml. Two ways this workflow handles that:
#   - If a RELEASE_PAT secret exists (fine-grained PAT, Contents: read/write), the tag is pushed with
#     it and publish.yml fires from the tag push (the classic path), OR
#   - otherwise we explicitly dispatch publish.yml at the new tag via `gh workflow run` — which
#     GITHUB_TOKEN IS allowed to do — so publishing works with no PAT required.

on:
  push:
    branches: [main]
    paths:
      - 'universal_printer_flutter/pubspec.yaml'

permissions:
  contents: write
  actions: write   # dispatch publish.yml (workflow_dispatch fallback when there is no RELEASE_PAT)

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Create + push tag if the version is new, then ensure publish runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep '^version:' universal_printer_flutter/pubspec.yaml | awk '{print $2}')
          tag="v$v"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "Created and pushed $tag"
          if [ -n "${{ secrets.RELEASE_PAT }}" ]; then
            echo "RELEASE_PAT present → the tag push triggers publish.yml directly."
          else
            # GITHUB_TOKEN can't trigger publish.yml via the tag push, but it CAN dispatch it.
            echo "No RELEASE_PAT → dispatching publish.yml at $tag."
            gh workflow run publish.yml --ref "$tag"
          fi
