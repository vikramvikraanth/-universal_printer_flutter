name: Bump version and tag

# On every push to main that touches the package, auto-increment the patch version in
# universal_printer_flutter/pubspec.yaml, prepend a CHANGELOG stub, commit back to main, and push a
# vX.Y.Z tag. The tag then triggers the publish workflow. The bump commit carries [skip ci] and is
# authored by the bot, so it never re-triggers this workflow (no loop).

on:
  push:
    branches: [main]
    paths:
      - 'universal_printer_flutter/**'

permissions:
  contents: write

concurrency:
  group: bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal_printer_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          current=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          IFS='.' read -r MA MI PA <<< "$current"
          new="$MA.$MI.$((PA + 1))"
          sed -i "s/^version: .*/version: $new/" pubspec.yaml
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "Bumped $current -> $new"

      - name: Prepend CHANGELOG entry
        run: |
          v="${{ steps.bump.outputs.version }}"
          msg=$(printf '%s' "${{ github.event.head_commit.message }}" | head -n1)
          { printf '# Changelog\n\n## %s\n\n- %s\n\n' "$v" "$msg"; tail -n +2 CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit, tag and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
